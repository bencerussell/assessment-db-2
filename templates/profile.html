{% extends "layout.html" %}
{% block content %}

<h2 style="color: #ffffff;">Profile</h2>

<!-- displays any error/success msgs -->
{%with messages = get_flashed_messages(with_categories=True) %} {%if messages%}
{%for category, message in messages%}
<p class="{{ category }}">{{message}}</p>
{%endfor%}
{%endif%} {%endwith%} 

<!-- user profile to show details and option to logout -->
<p>Email: {{ email }}</p>
<p>Username: {{ user }}</p>
<button><a style="color:white; text-decoration:none;" href="/logout">Logout</a></button>

{% endblock %}
