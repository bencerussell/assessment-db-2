{% extends "layout.html" %}

{% block title %}
{% if create_account %}
Create Account
{% else %}
Login
{% endif %}
{% endblock %}

{% block content %}

<h2>Login</h2>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="POST">

    <input
        type = "text"
        name = "username"
        placeholder = "Username">

    <input
        type = "password"
        name = "password"
        placeholder = "Password">
    <br>
    <button type="submit" name="action" value="login">
        Login
    </button>
    <br>
    <button type="submit" name="action" value="create" style="margin-top: 3px;">
        Create Account
    </button>
</form>

{% endblock %}
