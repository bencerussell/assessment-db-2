{% extends "layout.html" %}

{% block title %}

Login

{% endblock %}

{% block content %}

{% if create_account %}
<h2>Create Account</h2>
{% else %}
<h2>Login</h2>
{% endif %}

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

{% if create_account %}
<form method="POST">

    <input
        type = "email"
        name = "email"
        placeholder = "Email">

    <input
        type = "text"
        name = "username"
        placeholder = "Username">
    <br>
    <input
        type = "password"
        name = "password"
        placeholder = "Password">
    <input
        type = "password"
        name = "confirm_password"
        placeholder = "Confirm Password">
    <br>
    <button type="submit" name="action" value="actualcreate" style="margin-top: 3px;">
        Create Account
    </button>
</form>

{% else %}

<form method="POST">

    <input
        type = "text"
        name = "username"
        placeholder = "Username">

    <input
        type = "password"
        name = "password"
        placeholder = "Password">
    <br>
    <button type="submit" name="action" value="login">
        Login
    </button>
    <br>
    <button type="submit" name="action" value="create" style="margin-top: 3px;">
        Create Account
    </button>
</form>
{% endif %}

{% endblock %}
