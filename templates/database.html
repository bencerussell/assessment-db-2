{% extends "layout.html" %}
{% block content %}

<h2 style="color: #ffffff;">Welcome, {{user}}!</h2>

<!-- displays any error/success msgs -->
{%with messages = get_flashed_messages(with_categories=True) %} {%if messages%}
{%for category, message in messages%}
<p class="{{ category }}">{{message}}</p>
{%endfor%}
{%endif%} {%endwith%} 

<!-- shows options to view aircraft or operators -->
<button style="margin-inline:2px" type="button" onclick="window.location.href='/database/aircraft'">View Aircraft</button>
<button style="margin-inline:2px" type="button" onclick="window.location.href='/database/operators'">View Operators</button>

{% endblock %}
