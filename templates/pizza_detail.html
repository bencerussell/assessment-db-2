{% extends "layout.html" %}
{% block content %}
 
<!-- Display the pizza name as a heading -->
<h2>{{ pizza.name }}</h2>
 
<p>
  <!-- Format price to 2 decimal places using Jinja filter -->
  <strong>Price:</strong>
  ${{ "%.2f"|format(pizza.price) }}
</p>
 
<p>
  <a href="/pizzas">Back to all pizzas</a>
</p>
 
{% endblock %}
